[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermetic-agent"
version = "0.1.0"
description = "A zero-trust, closed-loop autonomous coding engine that synthesizes, sandboxes, and self-heals Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "langgraph==0.2.60",
    "google-genai==0.8.0",
    "pydantic==2.10.4",
    "docker==7.1.0",
    "python-dotenv==1.0.1",
]

[project.scripts]
hermetic = "main:cli"

[tool.setuptools]
packages = ["hermetic"]
py-modules = ["main"]

[tool.setuptools.package-data]
hermetic = ["Dockerfile.sandbox"]
